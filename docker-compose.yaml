# WAHA with native GOWS audio calls
# Quick start:
#   cp .env.example .env      # optional: adjust keys / WAHA_PUBLIC_IP
#   docker compose up --build -d
# Then open http://localhost:3000/dashboard (dashboard login) and http://localhost:3000 (Swagger).
services:
  waha:
    build:
      context: .
      args:
        USE_BROWSER: none
        WHATSAPP_DEFAULT_ENGINE: GOWS
    image: waha-calls:latest
    restart: always

    # Add "dns" if you have a problem resolving "web.whatsapp.com"
    dns:
      - 1.1.1.1
      - 8.8.8.8

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    ports:
      # HTTP API, Swagger and dashboard
      - "${WAHA_HTTP_PORT:-3000}:3000/tcp"
      # WebRTC media for the browser dialer (published 1:1 so the advertised
      # ICE candidate matches the reachable port).
      - "${WEBRTC_UDP_PORT:-7881}:${WEBRTC_UDP_PORT:-7881}/udp"

    environment:
      # Engine
      WHATSAPP_DEFAULT_ENGINE: GOWS

      # Auth. The dashboard connects with the API key by default, so keep them
      # in sync (default seeded key in the dashboard is "admin").
      WAHA_API_KEY: ${WAHA_API_KEY:-admin}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-admin}

      # Media storage
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_FILES_FOLDER: /app/.media

      # WebRTC networking for native calls.
      # Set WAHA_PUBLIC_IP to the host/IP the browser uses to reach this server
      # when it is not localhost (LAN IP, public IP, or 1:1 NAT such as Docker).
      WAHA_WEBRTC_UDP_PORT: ${WEBRTC_UDP_PORT:-7881}
      WAHA_PUBLIC_IP: ${WAHA_PUBLIC_IP:-}

    volumes:
      # Persist sessions and downloaded media across restarts
      - './sessions:/app/.sessions'
      - './media:/app/.media'
